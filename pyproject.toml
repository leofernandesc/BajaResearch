[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baja-research"
version = "0.5.0"
description = "Hermes plugin for verified free academic research in Baja SAE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leonardo Fernandes Cavalcante" }]
dependencies = ["httpx>=0.27,<1", "pypdf>=5,<7"]

[project.scripts]
baja-research = "baja_research_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = [
  "__init__",
  "baja_research_cli",
  "citations",
  "config",
  "models",
  "research_hooks",
  "querying",
  "routing",
  "ranking",
  "schemas",
  "storage",
  "tools",
]

[tool.setuptools.packages.find]
include = ["clients*"]
