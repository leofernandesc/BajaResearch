[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baja-research"
version = "0.1.0"
description = "Standalone Hermes Agent plugin for multi-source academic research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leonardo Fernandes Cavalcante" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = [
  "__init__",
  "models",
  "ranking",
  "schemas",
  "storage",
  "tools",
]

[tool.setuptools.packages.find]
include = ["clients*"]
