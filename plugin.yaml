name: baja-research
version: 0.3.0
description: "Verified free academic literature for Baja SAE engineering and project-management work."
author: "Leonardo Fernandes Cavalcante"
kind: standalone
api_version: 1
manifest_version: 2
homepage: "https://github.com/leofernandesc/BajaResearch"
license: MIT
tags:
  - academic-research
  - baja-sae
  - engineering
  - literature-search
provides_tools:
  - search_academic_papers
  - get_paper
  - find_related_papers
  - format_citation
  - research_cache_stats
provides_hooks:
  - pre_llm_call
python_dependencies:
  - "httpx>=0.27,<1"
config_schema:
  cache_ttl_hours:
    type: number
    default: 24
    description: "TTL for identical academic searches. Environment variable takes precedence."
  request_timeout_seconds:
    type: number
    default: 8
    description: "HTTP timeout per academic source request."
